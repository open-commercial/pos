<h2 mat-dialog-title>Sucursales</h2>

<mat-dialog-content>
  <mat-selection-list #branchesList [multiple]="false" (selectionChange)="onBranchSelectionChange($event)">

    @if ($loading()) {
    <div class="spinner">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
    } @else if ($error()) {
    <div class="error-state">
      <span class="error-message">No se pudo cargar la lista de sucursales</span>
      <button class="retry-button" matButton="outlined" (click)="loadBranches()">
        <mat-icon>refresh</mat-icon>
        Reintentar
      </button>
    </div>
    } @else {
    @for (s of $branches(); track s) {
    <mat-list-option [value]="s" [selected]="s.idSucursal === $selectedBranchId()">
      {{s.nombre}}
    </mat-list-option>
    }
    }

  </mat-selection-list>
</mat-dialog-content>

<mat-dialog-actions>
  @if (!$error()) {
  <button matButton mat-dialog-close [disabled]="$loading()" tabindex="-1">Cancelar</button>
  <button matButton="filled" 
    (click)="selectBranchAsDefault(branchesList.selectedOptions.selected[0].value)"
    [disabled]="$loading()">
    Aceptar
  </button>
  }
</mat-dialog-actions>
